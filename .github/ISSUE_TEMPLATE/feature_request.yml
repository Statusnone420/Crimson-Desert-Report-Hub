name: Feature request
description: Suggest a product or automation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this help players, moderators, or contributors do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, cost, or moderation risks
      description: Note anything that could expose raw data, add spend, or weaken trust.
