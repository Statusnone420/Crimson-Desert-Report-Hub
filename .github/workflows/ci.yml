name: CI

# GitHub runs the full gate on every pull request to main: the core checks,
# the browser suites, and every migration plus the database tests on a
# throwaway local database. Branches from forks are not tested here; an
# accepted outside change is applied on a branch in this repository first.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false

      - name: Shared core verification
        run: npm run verify:core

  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false

      - name: Install Chromium system libraries
        run: |
          npm ci
          npx playwright install-deps chromium

      - name: Shared browser verification
        run: npm run verify:browser

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # The runner is disposable, so this local stack never touches a hosted
      # project or anyone's saved data.
      - name: Start a throwaway local database
        run: npx supabase db start

      - name: Apply every migration in order
        run: npx supabase db reset

      - name: Database tests
        run: npx supabase test db

      - name: Stop the database
        if: always()
        run: npx supabase stop --no-backup
